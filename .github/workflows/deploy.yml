name: Deploy furshet (вручную)

# Деплой на web-1 запускается только руками:
# Actions → Deploy furshet (вручную) → Run workflow.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to web-1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/furshet
            git fetch origin
            git reset --hard origin/redesign
            docker build -t furshet .
            docker rm -f furshet
            docker run -d --name furshet --network web --restart unless-stopped -e DATABASE_URL="${{ secrets.DATABASE_URL_LOCAL }}"
            docker image prune -f