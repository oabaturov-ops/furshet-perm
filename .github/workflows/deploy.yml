name: Deploy furshet

on:
  push:
    branches: [redesign]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to web-1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/furshet
            git pull
            docker build -t furshet .
            docker rm -f furshet
            docker run -d --name furshet --network web --restart unless-stopped furshet
            docker image prune -f
